<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#156B5E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="SafeDischarge — multi-agent clinical discharge coordination. AI prepares the draft; clinicians decide."
    />
    <title>SafeDischarge · Clinical Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans is requested as a variable axis (400..800) rather
         than as a handful of static cuts. The type scale leans on in-between
         weights — 620 for a card title, 680 for a page title — which silently
         rounded to the nearest static cut before, flattening the hierarchy.
         Inter is gone: it was downloaded in full and never used, since Plus
         Jakarta sits ahead of it in every font stack. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint, otherwise a dark-mode user
      // gets a white flash on every reload.
      (function () {
        try {
          var stored = localStorage.getItem('safedischarge.theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode — fall back to light */
        }
      })();
    </script>
    <style>
      /* Shown until React mounts, so the first frame is never a blank page. */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background: #faf9f7;
      }
      html.dark #root:empty::after {
        background: #100f0e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
